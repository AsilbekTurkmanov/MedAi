version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medai-postgres
    restart: always
    environment:
      POSTGRES_DB: medaidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medaidb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medai-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  medai-api:
    build:
      context: .
      dockerfile: src/MedAI.API/Dockerfile
    container_name: medai-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=medaidb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      - Jwt__Secret=${JWT_SECRET:-MedAI_Super_Secret_JWT_Key_2026_For_Healthcare_Platform_Security!}
    ports:
      - "${BACKEND_PORT:-5010}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  medai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5010/api}
    container_name: medai-frontend
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    depends_on:
      - medai-api

volumes:
  postgres_data:
  redis_data:
