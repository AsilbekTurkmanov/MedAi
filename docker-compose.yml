version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medai-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medaidb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medaidb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medai-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  medai-api:
    build:
      context: .
      dockerfile: src/MedAI.API/Dockerfile
    container_name: medai-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-medaidb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - AI_PROVIDER=${AI_PROVIDER:-OpenAI}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy

  medai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5050/api}
    container_name: medai-frontend
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    depends_on:
      - medai-api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
